name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git
          pip install cython buildozer
      
      # ✅ Yeh step add karo - Buildozer ke SDK mein license accept karo
      - name: Pre-setup Android SDK for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          export ANDROIDSDK=~/.buildozer/android/platform/android-sdk
          # Buildozer ke SDK ko pre-accept karo
          yes | buildozer android debug --dry-run || true
        continue-on-error: true
      
      - name: Build APK
        timeout-minutes: 60
        run: |
          # Environment set karo
          export ANDROIDSDK=~/.buildozer/android/platform/android-sdk
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: plant-doctor-apk
          path: bin/*.apk
          retention-days: 5
