- name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            libffi-dev \
            libgdbm-dev \
            libncursesw5-dev \
            libncurses5-dev \
            libncurses5 \
            libtinfo5 \
            pkg-config \
            autoconf \
            automake \
            libtool \
            m4 \
            libtool-bin
