name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --user --upgrade "setuptools<66.0.0" "buildozer>=1.5.0" "cython<3.0.0" wheel

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Licenses ko zabardasti accept karwana
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | buildozer android debug --init || true
          
          # Final Build
          buildozer -v android debug
